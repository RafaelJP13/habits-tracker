services:
  mysql:
    image: mysql:8.4
    container_name: laravel-mysql
    restart: unless-stopped

    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: habits_tracker
      MYSQL_USER: test
      MYSQL_PASSWORD: test

    ports:
      - "3306:3306"

    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data:
